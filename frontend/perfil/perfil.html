<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil</title>

    <link rel="stylesheet" href="perfil.css">
</head>

<body>

    <main class="perfil-container">

        <section class="perfil-card">

            <div class="avatar">
                <span id="avatarInicial">?</span>
            </div>

            <h1>Meu Perfil</h1>

            <p class="subtitulo">
                Confira e edite suas informações
            </p>

            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                    disabled
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                    disabled
                >
            </div>

            <div class="botoes">

                <button id="editarBtn" class="btn-principal">
                    Editar perfil
                </button>

                <button id="salvarBtn" class="btn-principal" hidden>
                    Salvar alterações
                </button>

                <button id="cancelarBtn" class="btn-cancelar" hidden>
                    Cancelar
                </button>

            </div>

            <p id="mensagem"></p>

            <button id="sairBtn" class="btn-sair">
                Sair da conta
            </button>

        </section>

    </main>

    <script src="perfil.js"></script>

</body>

</html>
