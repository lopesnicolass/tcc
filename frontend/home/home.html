<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ETEC Prep</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <header>

        <div class="logo">
            ETEC Prep
        </div>

        <nav>
            <a href="home.html">Início</a>
            <a href="../perfil/perfil.html">Perfil</a>
        </nav>

    </header>


    <main>

        <section class="boas-vindas">

            <h1>
                Olá, <span id="nomeAluno">Aluno</span>!
            </h1>

            <p>
                Prepare-se para o Vestibulinho da ETEC.
            </p>

            <button id="estudarBtn">
                Começar a estudar
            </button>

        </section>


        <section class="recursos">

            <div class="card">
                <h2>Questões</h2>
                <p>
                    Pratique com questões para testar seus conhecimentos.
                </p>
            </div>

            <div class="card">
                <h2>Simulados</h2>
                <p>
                    Faça simulados e prepare-se para a prova.
                </p>
            </div>

            <div class="card">
                <h2>Meu progresso</h2>
                <p>
                    Acompanhe seu desempenho nos estudos.
                </p>
            </div>

        </section>

    </main>


    <script>

        const usuarioSalvo = localStorage.getItem("usuario");

        if (!usuarioSalvo) {

            window.location.href = "../login/login.html";

        } else {

            const usuario = JSON.parse(usuarioSalvo);

            document.getElementById("nomeAluno").textContent =
                usuario.nome;

        }

    </script>

</body>

</html>
